<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Defend the Fort: Stop ATO</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Progress Bar -->
    <div class="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <!-- Welcome Screen -->
    <div id="welcome-screen">
      <h1>Defend the Fort</h1>
      <p>Think you can stop account takeovers? Test your fraud detection skills!</p>
      <button id="start-btn">Start Game</button>
    </div>

    <!-- Game Screen -->
    <div id="quiz-level" class="hidden">
      <h2 id="question">What is an account takeover (ATO)?</h2>
      <div class="options">
        <button class="option" onclick="checkAnswer(this, false)">A) A legitimate customer logs in to their account.</button>
        <button class="option" onclick="checkAnswer(this, true)">B) A malicious actor gains access to an account without authorization.</button>
        <button class="option" onclick="checkAnswer(this, false)">C) A customer voluntarily shares their account details with another person.</button>
      </div>
      <button id="next-question" class="hidden" onclick="showNextQuestion()">Next</button>
    </div>

    <!-- End Screen -->
    <div id="end-screen" class="hidden">
      <h2>Congratulations! 🎉</h2>
      <p>Your final score is: <span id="score"></span></p>
      <button onclick="restartGame()">Play Again</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
