<!-- Result Screen -->
<section id="result-screen" class="card hidden" aria-live="polite">
  <h1 id="result-title">Congratulations!</h1>
  <p>Your final score is: <strong id="final-score">0</strong></p>
  <div id="pass-block" class="pass-block hidden">
    <p>🎉 Great job! You’ve met the passing threshold (70).</p>
  </div>
  <div id="fail-block" class="fail-block hidden">
    <p>❌ You didn’t reach 70 this time. Review the material and try again!</p>
  </div>
  <div class="actions">
    <button id="restart-btn" class="btn secondary">Restart</button>
  </div>
</section>

<!-- Scripts at the end -->
<script src="script.js"></script>
</body>
</html>
