<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Defend the Fort</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Progress Bar -->
    <div class="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <!-- Score Tracker -->
    <div id="score-tracker">Score: 0</div>

    <!-- Welcome Screen -->
    <div id="welcome-screen">
      <h1>Defend the Fort</h1>
      <p>Think you can stop account takeovers? Test your fraud detection skills!</p>
      <button id="start-btn">Start Game</button>
    </div>

    <!-- Quiz Level Screen -->
    <div id="quiz-level" class="hidden">
      <h2 id="question">Loading Question...</h2>
      <div class="options">
        <!-- Options will dynamically populate here -->
      </div>
      <div id="feedback"></div>
      <button id="next-question" class="hidden">Next Question</button>
    </div>

    <!-- End Screen -->
    <div id="end-screen" class="hidden">
      <h2>Game Complete! 🎉</h2>
      <p>Your total score: <span id="score"></span></p>
      <div id="certificate-section" class="hidden">
        <button id="certificate-btn" onclick="generateCertificate()">Download Certificate</button>
      </div>
      <button onclick="restartGame()">Play Again</button>
    </div>
  </div>

  <!-- Include Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
