<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATO Training Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <!-- Welcome Screen -->
    <div id="welcome-screen">
      <h1>Welcome to the ATO Training Game</h1>
      <p>Test your ability to identify and handle account takeovers.</p>
      <button id="start-game">Start Game</button>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="hidden">
      <div id="progress-container">
        <div id="progress-bar"></div>
      </div>
      <h2 id="question"></h2>
      <div id="answers"></div>
      <div id="footer">
        <p id="score-tracker">Score: 0</p>
        <p id="timer">Time Left: 15s</p>
        <button id="hint-btn" class="hidden">Get Hint</button>
        <p id="hint-text" class="hint-text"></p>
      </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hidden">
      <h1>Congratulations!</h1>
      <p>Your final score is: <span id="final-score"></span>/140</p>
      <button id="certificate-btn">Download Certificate</button>
      <button id="restart-btn">Restart Game</button>
    </div>
  </div>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
